<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Mojo Mixer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Random App</p>
        <h1>Mojo Mixer</h1>
        <p class="subtitle">
          Tap the button to generate a random combo of a vibe, a snack, and a mini
          mission.
        </p>
      </header>

      <section class="card" aria-live="polite">
        <div class="row">
          <span class="label">Vibe</span>
          <span id="vibe" class="value">Sunny Focus</span>
        </div>
        <div class="row">
          <span class="label">Snack</span>
          <span id="snack" class="value">Berry Yogurt</span>
        </div>
        <div class="row">
          <span class="label">Mini Mission</span>
          <span id="mission" class="value">Write down three wins from today.</span>
        </div>
      </section>

      <section class="controls">
        <button id="mix" class="primary">Mix it up</button>
        <button id="save" class="ghost">Save to list</button>
      </section>

      <section class="history">
        <div class="history-header">
          <h2>Saved Mixes</h2>
          <button id="clear" class="text">Clear all</button>
        </div>
        <ul id="list" class="history-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
