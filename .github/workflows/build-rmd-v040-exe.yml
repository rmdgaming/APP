name: Build RMD 0.5 Windows EXE

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - rmd-security-v050-exe-build

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct verified RMD 0.4 base
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'RMD-0.4.0-reconstructed.tar.gz'
          $parts = @(Get-ChildItem 'rmd-build/chunks/part-*.b64' | Where-Object { $_.Name -ne 'part-010.b64' } | Sort-Object Name)
          if ($parts.Count -ne 13) { throw "Expected 13 verified RMD 0.4 chunks, found $($parts.Count)." }
          $stream = [System.IO.File]::Create($archive)
          try {
            foreach ($part in $parts) {
              $text = [System.IO.File]::ReadAllText($part.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '3a33b50b8bc46a0a49ad912531ff03b00d666a12e3d0d80d1099b8a0b2a6f2f3'
          if ($actual -ne $expected) { throw "RMD 0.4 base hash mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path rmd-security | Out-Null
          tar -xzf $archive -C rmd-security
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not extract the verified RMD 0.4 base." }

      - name: Reconstruct and apply verified RMD 0.5 overlay
        shell: pwsh
        run: |
          $overlay = Join-Path $PWD 'RMD-0.5.0-overlay.tar.xz'
          $parts = @(Get-ChildItem 'rmd-build/overlay050/part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 7) { throw "Expected 7 RMD 0.5 overlay chunks, found $($parts.Count)." }
          $stream = [System.IO.File]::Create($overlay)
          try {
            foreach ($part in $parts) {
              $text = [System.IO.File]::ReadAllText($part.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '1267dd1d9223c3da6d046722e4f7de11f5a3a9934d04d002039048409b2807fb'
          if ($actual -ne $expected) { throw "RMD 0.5 overlay hash mismatch: $actual" }

          New-Item -ItemType Directory -Force -Path overlay050 | Out-Null
          tar -xJf $overlay -C overlay050
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not extract the verified RMD 0.5 overlay." }

          Get-Content 'overlay050/DELETE_PATHS.txt' | ForEach-Object {
            $relative = $_.Trim()
            if ($relative) {
              $target = Join-Path 'rmd-security' $relative
              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          tar -xJf $overlay -C rmd-security
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not apply the verified RMD 0.5 overlay." }
          Remove-Item 'rmd-security/DELETE_PATHS.txt' -Force -ErrorAction SilentlyContinue
          Copy-Item 'rmd-build/overlay050/server-main.py' 'rmd-security/server/main.py' -Force

          $version = Select-String -Path 'rmd-security/pyproject.toml' -Pattern 'version = "0.5.0"'
          if (-not $version) { throw 'The reconstructed source is not RMD 0.5.0.' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rmd-security/pyproject.toml

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, test, and package RMD 0.5
        shell: pwsh
        working-directory: rmd-security
        run: |
          $python = (Get-Command python.exe).Source
          $inno = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $inno) { throw 'Inno Setup compiler was not found.' }

          python -m venv .windows-build-venv
          .\.windows-build-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.windows-build-venv\Scripts\python.exe -m pip install 'pillow>=10,<13'
          .\scripts\build_windows_installer.ps1 -PythonPath $python -InnoSetupPath $inno
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify final installer and packaged components
        shell: pwsh
        working-directory: rmd-security
        run: |
          $installer = Resolve-Path 'dist-installer\RMD-Setup-0.5.0.exe'
          $nativeHost = Resolve-Path 'dist\RMD-NativeHost.exe'
          $agent = Resolve-Path 'dist\RMD-Agent.exe'
          $chromiumManifest = Resolve-Path 'extension\chromium\manifest.json'
          $firefoxManifest = Resolve-Path 'extension\firefox\manifest.json'
          foreach ($path in @($installer, $nativeHost, $agent, $chromiumManifest, $firefoxManifest)) {
            Get-Item $path | Format-List FullName,Length,LastWriteTime
          }
          $header = [System.IO.File]::ReadAllBytes($installer)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw 'Final installer is not a Windows PE executable.' }
          $hash = Get-FileHash $installer -Algorithm SHA256
          "$($hash.Hash)  RMD-Setup-0.5.0.exe" | Set-Content 'dist-installer\RMD-Setup-0.5.0-SHA256.txt' -Encoding ascii
          $hash | Format-List

      - name: Upload single installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: RMD-Setup-0.5.0
          path: |
            rmd-security/dist-installer/RMD-Setup-0.5.0.exe
            rmd-security/dist-installer/RMD-Setup-0.5.0-SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
