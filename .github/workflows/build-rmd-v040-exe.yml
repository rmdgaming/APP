name: Build RMD 0.4 Windows EXE

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - rmd-security-v040-exe

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'RMD-0.4.0-source.tar.gz'
          $stream = [System.IO.File]::Create($archive)
          try {
            Get-ChildItem 'rmd-build/chunks/part-*.b64' | Sort-Object Name | ForEach-Object {
              $text = [System.IO.File]::ReadAllText($_.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '3a33b50b8bc46a0a49ad912531ff03b00d666a12e3d0d80d1099b8a0b2a6f2f3'
          if ($actual -ne $expected) { throw "Source archive hash mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path rmd-security | Out-Null
          tar -xzf $archive -C rmd-security

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rmd-security/pyproject.toml

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install, test, and build
        shell: pwsh
        working-directory: rmd-security
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,build]'
          python -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --noconfirm --clean --windowed --name RMD --paths src --collect-all argon2 --collect-all cryptography packaging/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --noconfirm --clean --onefile --windowed --name RMD-Agent --paths src --collect-all argon2 --collect-all cryptography packaging/agent_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $innoCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $inno = $innoCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $inno) { throw 'Inno Setup compiler was not found.' }
          & $inno 'packaging\windows\RMD.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify final installer
        shell: pwsh
        working-directory: rmd-security
        run: |
          $installer = Resolve-Path 'dist-installer\RMD-Setup-0.4.0.exe'
          $hash = Get-FileHash $installer -Algorithm SHA256
          "$($hash.Hash)  RMD-Setup-0.4.0.exe" | Set-Content 'dist-installer\RMD-Setup-0.4.0-SHA256.txt' -Encoding ascii
          Get-Item $installer | Format-List FullName,Length,LastWriteTime
          $hash | Format-List

      - name: Upload single installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: RMD-Setup-0.4.0
          path: |
            rmd-security/dist-installer/RMD-Setup-0.4.0.exe
            rmd-security/dist-installer/RMD-Setup-0.4.0-SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
