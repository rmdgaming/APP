name: Build and publish RMD 0.6.0

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - rmd-security-v060-exe-build

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct verified RMD 0.4 base
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'RMD-0.4.0-reconstructed.tar.gz'
          $parts = @(Get-ChildItem 'rmd-build/chunks/part-*.b64' | Where-Object { $_.Name -ne 'part-010.b64' } | Sort-Object Name)
          if ($parts.Count -ne 13) { throw "Expected 13 verified RMD 0.4 chunks, found $($parts.Count)." }
          $stream = [System.IO.File]::Create($archive)
          try {
            foreach ($part in $parts) {
              $text = [System.IO.File]::ReadAllText($part.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '3a33b50b8bc46a0a49ad912531ff03b00d666a12e3d0d80d1099b8a0b2a6f2f3'
          if ($actual -ne $expected) { throw "RMD 0.4 base hash mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path rmd-security | Out-Null
          tar -xzf $archive -C rmd-security
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not extract the verified RMD 0.4 base." }

      - name: Reconstruct and apply verified RMD 0.5 overlay
        shell: pwsh
        run: |
          $overlay = Join-Path $PWD 'RMD-0.5.0-overlay.tar.xz'
          $parts = @(Get-ChildItem 'rmd-build/overlay050/part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 7) { throw "Expected 7 RMD 0.5 overlay chunks, found $($parts.Count)." }
          $stream = [System.IO.File]::Create($overlay)
          try {
            foreach ($part in $parts) {
              $text = [System.IO.File]::ReadAllText($part.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '1267dd1d9223c3da6d046722e4f7de11f5a3a9934d04d002039048409b2807fb'
          if ($actual -ne $expected) { throw "RMD 0.5 overlay hash mismatch: $actual" }

          New-Item -ItemType Directory -Force -Path overlay050 | Out-Null
          tar -xJf $overlay -C overlay050
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not extract the verified RMD 0.5 overlay." }

          Get-Content 'overlay050/DELETE_PATHS.txt' | ForEach-Object {
            $relative = $_.Trim()
            if ($relative) {
              $target = Join-Path 'rmd-security' $relative
              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          tar -xJf $overlay -C rmd-security
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not apply the verified RMD 0.5 overlay." }
          Remove-Item 'rmd-security/DELETE_PATHS.txt' -Force -ErrorAction SilentlyContinue
          Copy-Item 'rmd-build/overlay050/server-main.py' 'rmd-security/server/main.py' -Force

          $version = Select-String -Path 'rmd-security/pyproject.toml' -Pattern 'version = "0.5.0"'
          if (-not $version) { throw 'The reconstructed source is not RMD 0.5.0.' }

      - name: Reconstruct and apply verified RMD 0.5.1 hotfix
        shell: pwsh
        run: |
          $overlay = Join-Path $PWD 'RMD-0.5.1-overlay.tar.xz'
          $parts = @(Get-ChildItem 'rmd-build/overlay051/part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 9) { throw "Expected 9 RMD 0.5.1 overlay chunks, found $($parts.Count)." }
          $stream = [System.IO.File]::Create($overlay)
          try {
            foreach ($part in $parts) {
              $text = [System.IO.File]::ReadAllText($part.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '7aed816e806e7ac8cf8aaf61d56ce2f194b377b11937e8e20b0fe2c78b73045d'
          if ($actual -ne $expected) { throw "RMD 0.5.1 overlay hash mismatch: $actual" }
          tar -xJf $overlay -C rmd-security
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not apply the verified RMD 0.5.1 hotfix." }
          $version = Select-String -Path 'rmd-security/pyproject.toml' -Pattern 'version = "0.5.1"'
          if (-not $version) { throw 'The reconstructed source is not RMD 0.5.1.' }

      - name: Reconstruct and apply verified RMD 0.6.0 update layer
        shell: pwsh
        run: |
          $overlay = Join-Path $PWD 'RMD-0.6.0-overlay.tar.xz'
          $parts = @(Get-ChildItem 'rmd-build/overlay060/part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 8) { throw "Expected 8 RMD 0.6.0 overlay chunks, found $($parts.Count)." }
          $stream = [System.IO.File]::Create($overlay)
          try {
            foreach ($part in $parts) {
              $text = [System.IO.File]::ReadAllText($part.FullName).Trim()
              $bytes = [Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          $actual = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '87e8a1b0f4f7ac525a5bb664f918d766182234ef5a7ebc040b1309e5406f6c05'
          if ($actual -ne $expected) { throw "RMD 0.6.0 overlay hash mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path overlay060 | Out-Null
          tar -xJf $overlay -C overlay060
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not extract the verified RMD 0.6.0 overlay." }
          Get-Content 'overlay060/DELETE_PATHS.txt' | ForEach-Object {
            $relative = $_.Trim()
            if ($relative) {
              Remove-Item -LiteralPath (Join-Path 'rmd-security' $relative) -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          tar -xJf $overlay -C rmd-security
          if ($LASTEXITCODE -ne 0) { throw "Windows tar could not apply the verified RMD 0.6.0 overlay." }
          Remove-Item 'rmd-security/DELETE_PATHS.txt' -Force -ErrorAction SilentlyContinue
          if (-not (Select-String -Path 'rmd-security/pyproject.toml' -Pattern 'version = "0.6.0"')) {
            throw 'The reconstructed source is not RMD 0.6.0.'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rmd-security/pyproject.toml

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, test, and package RMD 0.6.0
        shell: pwsh
        working-directory: rmd-security
        run: |
          $python = (Get-Command python.exe).Source
          $inno = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $inno) { throw 'Inno Setup compiler was not found.' }

          python -m venv .windows-build-venv
          .\.windows-build-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.windows-build-venv\Scripts\python.exe -m pip install 'pillow>=10,<13'
          .\scripts\build_windows_installer.ps1 -PythonPath $python -InnoSetupPath $inno
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify final installer and update manifest
        shell: pwsh
        working-directory: rmd-security
        run: |
          $installer = Resolve-Path 'dist-installer\RMD-Setup-0.6.0.exe'
          $manifest = Resolve-Path 'dist-installer\rmd-update.json'
          $checksum = Resolve-Path 'dist-installer\RMD-Setup-0.6.0-SHA256.txt'
          $nativeHost = Resolve-Path 'dist\RMD-NativeHost.exe'
          $agent = Resolve-Path 'dist\RMD-Agent.exe'
          foreach ($path in @($installer, $manifest, $checksum, $nativeHost, $agent)) {
            Get-Item $path | Format-List FullName,Length,LastWriteTime
          }
          $header = [System.IO.File]::ReadAllBytes($installer)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw 'Final installer is not a Windows PE executable.' }
          $payload = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($payload.version -ne '0.6.0' -or $payload.product -ne 'rmd-security' -or $payload.platform -ne 'windows-x64') {
            throw 'Invalid update manifest identity.'
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $payload.installer.sha256.ToLowerInvariant()) { throw 'Update manifest SHA-256 mismatch.' }
          if ((Get-Item $installer).Length -ne [int64]$payload.installer.size) { throw 'Update manifest size mismatch.' }
          if ($payload.installer.asset_name -ne 'RMD-Setup-0.6.0.exe') { throw 'Update manifest asset mismatch.' }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMD-Setup-0.6.0
          path: |
            rmd-security/dist-installer/RMD-Setup-0.6.0.exe
            rmd-security/dist-installer/RMD-Setup-0.6.0-SHA256.txt
            rmd-security/dist-installer/rmd-update.json
            rmd-security/RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish private update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: rmd-security
        run: |
          $tag = 'rmd-v0.6.0'
          $assets = @(
            'dist-installer\RMD-Setup-0.6.0.exe',
            'dist-installer\RMD-Setup-0.6.0-SHA256.txt',
            'dist-installer\rmd-update.json'
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title 'RMD Security 0.6.0' --notes-file RELEASE_NOTES.md --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title 'RMD Security 0.6.0' --notes-file RELEASE_NOTES.md --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
